name: Generador Automatico de EPG

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 06:00 UTC (12:00 AM hora México)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutar el script manualmente desde GitHub cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Ejecutar script generador de EPG
      run: python "epg generador.py"

    - name: Guardar y subir el archivo epg.xml actualizado a GitHub
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        git commit -m "Auto-update: EPG generado automáticamente" || echo "No hay cambios para guardar"
        git push
